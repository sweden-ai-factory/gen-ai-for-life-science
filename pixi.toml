[workspace]
authors = ["Ashwin V. Mohanan"]
channels = ["conda-forge", "nodefaults"]
name = "workshop"
platforms = [
    "win-64",
    "linux-64",
    "osx-64",
    "osx-arm64",
    { platform = "linux-64", cuda = "12.0" },
    { platform = "linux-64", cuda = "13.0" },
]
version = "0.1.0"

[feature.gpu]
platforms = [
    "linux-64-cuda-12-0",
    "linux-64-cuda-13-0"
]  # the synthesized names for the entry above

[feature.gpu.dependencies]
# cuda-version = "13.*"
pytorch-gpu = ">=2.1"

[feature.cpu.dependencies]
pytorch-cpu = ">=2.1"

[environments]
default = ["cpu"]
gpu = ["gpu"]

[tasks]

[dependencies]
python = ">=3.10"
torchvision = ">=0.16"
pytorch_scatter = ">=2.1.2"
transformers = ">=4.45"
accelerate = ">=0.34"
peft = ">=0.12"
datasets = ">=2.20"
huggingface_hub = ">=0.24"
sentencepiece = ">=0.2.0"
einops = ">=0.7.0"
qwen-vl-utils = ">=0.0.8"
scikit-learn = ">=1.3"
matplotlib-base = ">=3.7"
numpy = ">=1.24"
pandas = ">=2.0"
pillow = ">=10.0"
seaborn = ">=0.13"
captum = ">=0.7"
pyarrow = ">=14.0"
fsspec = ">=2024.2.0"
tqdm = ">=4.66"
requests = ">=2.31"
jupyter = ">=1.0"
ipykernel = ">=6.29"
nbformat = ">=5.10"
pip = "*"

[pypi-dependencies]
medmnist = ">=3.0.2"
opencv-python-headless = ">=4.8"
fair-esm = ">=2.0.0"
